<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de distribuidoras – Araraquara</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;color:#1f2430;background:#f4f5f7}
  .app{display:flex;height:100vh}
  #map{flex:1;min-height:300px;background:#e8eaed}
  aside{width:420px;display:flex;flex-direction:column;background:#fff;border-left:1px solid #e3e5ea}
  header{padding:16px 16px 10px;border-bottom:1px solid #eef0f3}
  h1{font-size:18px;margin:0 0 2px}
  .sub{font-size:13px;color:#6b7280;margin:0 0 10px}
  .prog{height:8px;background:#eef0f3;border-radius:6px;overflow:hidden}
  .prog div{height:100%;background:#16a34a;width:0;transition:width .3s}
  .progtxt{font-size:12px;color:#6b7280;margin-top:4px}
  .tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .tools input{flex:1 1 100%;padding:9px 10px;border:1px solid #d6d9df;border-radius:8px;font-size:14px;font-family:inherit}
  .chip{border:1px solid #d6d9df;background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .chip.on{background:#1f2430;color:#fff;border-color:#1f2430}
  #lista{flex:1;overflow-y:auto;padding:10px 12px 90px}
  .item{display:flex;gap:10px;padding:10px;border-radius:12px;border:1px solid #eef0f3;margin-bottom:8px;background:#fff;cursor:pointer;transition:box-shadow .15s,border-color .15s}
  .item:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .item.ativo{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.2)}
  .item.feito{opacity:.6}
  .item.feito .nome{text-decoration:line-through}
  .thumb{width:76px;height:76px;flex:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:700;position:relative;overflow:hidden;border:0;cursor:pointer;font-family:inherit}
  .thumb{background-color:#334155;background-repeat:no-repeat}
  .thumb::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55))}
  .thumb .n,.thumb .lbl{position:relative}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .caixa img.big{width:100%;height:min(60vh,520px);object-fit:contain;background:#111;display:none}
  .thumb .n{font-size:24px;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .thumb .lbl{font-size:10px;font-weight:600;margin-top:6px;background:rgba(0,0,0,.25);padding:2px 6px;border-radius:999px}
  .corpo{flex:1;min-width:0}
  .nome{font-weight:700;font-size:14px}
  .meta{font-size:12px;color:#6b7280;margin-top:2px}
  .tipo{display:inline-block;font-size:11px;background:#f1f3f6;color:#4b5563;border-radius:6px;padding:1px 6px;margin-top:4px}
  .linha{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
  .linha a,.linha button{font-size:12px;padding:5px 9px;border-radius:8px;border:1px solid #d6d9df;background:#fff;color:#2563eb;text-decoration:none;font-weight:600;cursor:pointer;font-family:inherit}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#374151;margin-right:auto}
  .chk input{width:18px;height:18px}
  .vou.on{background:#fff7d6;border-color:#f2c94c;color:#8a6100}
  .linha button.naovou{color:#6b7280}
  .naovou.on{background:#f3f4f6;border-color:#9ca3af;color:#374151}
  .item.nao{opacity:.5}
  .barra{position:absolute;left:0;right:0;bottom:0;padding:12px;background:linear-gradient(transparent,#fff 30%)}
  .barra button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .barra button:disabled{background:#a7b0c0;cursor:default}
  aside{position:relative}
  .pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35)}
  .pin span{transform:rotate(45deg);color:#fff;font-size:12px;font-weight:700;font-family:Inter,Arial,sans-serif}
  .pin.sel{outline:3px solid #2563eb}
  .if{background:#111827;color:#fff;font-weight:700;font-size:11px;padding:4px 8px;border-radius:8px;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.35);text-align:center}
  .modal{position:fixed;inset:0;background:rgba(17,24,39,.7);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
  .modal.on{display:flex}
  .caixa{background:#fff;border-radius:14px;width:min(900px,100%);overflow:hidden}
  .caixa .topo{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #eef0f3}
  .caixa .topo b{font-size:15px}
  .caixa .topo button{border:0;background:#f1f3f6;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
  .abas{display:flex;gap:6px;padding:8px 14px 0}
  .aba{border:1px solid #d6d9df;background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  .aba.on{background:#1f2430;color:#fff;border-color:#1f2430}
  .caixa iframe{width:100%;height:min(60vh,520px);border:0;display:block;background:#e8eaed}
  .caixa .pe{padding:10px 14px;font-size:13px;color:#6b7280;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
  .caixa .pe a{color:#2563eb;font-weight:700}
  .legenda{position:absolute;z-index:1000;left:10px;bottom:10px;background:#fff;border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .legenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 8px;vertical-align:middle}
  .legenda i:first-child{margin-left:0}
  .mapwrap{position:relative;flex:1;display:flex}
  @media (max-width:800px){
    .app{flex-direction:column;height:auto}
    .mapwrap{height:45vh;flex:none}
    aside{width:100%;border-left:0}
    #lista{overflow:visible}
    .barra{position:fixed}
  }
</style>
</head>
<body>
<div class="app">
  <div class="mapwrap"><div id="map"></div>
    <div class="legenda"><i style="background:#2563eb"></i>Pendente<i style="background:#d97706"></i>Vou<i style="background:#16a34a"></i>Visitado<i style="background:#9ca3af"></i>Não vou</div>
  </div>
  <aside>
    <header>
      <h1>Distribuidoras e adegas · Araraquara</h1>
      <p class="sub">Numeradas da mais perto para a mais longe do IFSP.</p>
      <div class="prog"><div id="progbar"></div></div>
      <div class="progtxt" id="progtxt"></div>
      <div class="tools">
        <input type="search" id="busca" placeholder="Buscar nome ou bairro">
        <button class="chip on" data-f="todos">Todos</button>
        <button class="chip" data-f="pend">Pendentes</button>
        <button class="chip" data-f="vou">Vou</button>
        <button class="chip" data-f="feito">Visitados</button>
        <button class="chip" data-f="nao">Não vou</button>
      </div>
    </header>
    <div id="lista"></div>
    <div class="barra"><button id="rota" disabled>Marque "Vou" para montar a rota</button></div>
  </aside>
</div>

<div class="modal" id="modal">
  <div class="caixa">
    <div class="topo"><b id="mtit"></b><button id="mfechar">Fechar ✕</button></div>
    <div class="abas"><button class="aba" data-aba="foto" id="abaFoto">Foto</button><button class="aba on" data-aba="sv">Street View</button><button class="aba" data-aba="sat">Satélite</button></div>
    <img id="mimg" class="big" alt="" referrerpolicy="no-referrer"><iframe id="mframe" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div class="pe"><span id="mdica">Arraste para girar. Às vezes o Google mostra uma foto de dentro de um lugar vizinho; aí use as setas ou abra no Maps.</span><a id="mlink" target="_blank" rel="noopener">Abrir Street View no Google Maps</a></div>
  </div>
</div>

os dias até 0h", "r": 5.0, "nr": 4, "lat": -21.7775703, "lng": -48.1189601, "foto": "https://streetviewpixels-pa.googleapis.com/v1/thumbnail?panoid=pdXBymYhxBsMcm5AIqGx_Q&cb_client=maps_sv.tactile.gps&w=900&h=600&yaw=126.7&pitch=0&thumbfov=100"}];
const COR = {pend:"#2563eb", vou:"#d97706", feito:"#16a34a", nao:"#9ca3af"};

let st = {};
try { st = JSON.parse(localStorage.getItem("araraquara_status") || "{}"); } catch(e) {}
const salvar = () => { try { localStorage.setItem("araraquara_status", JSON.stringify(st)); } catch(e) {} };
const estado = i => st[i] || "pend";
let filtro = "todos", ativo = null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kmTxt = k => String(k).replace(".", ",");
const svUrl = l => "https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=" + l.lat + "," + l.lng;
const svEmbed = l => "https://www.google.com/maps?layer=c&cbll=" + l.lat + "," + l.lng + "&cbp=12,0,0,0,0&output=svembed";
const svEmbed2 = l => "https://maps.google.com/maps?q=&layer=c&cbll=" + l.lat + "," + l.lng + "&cbp=11,0,0,0,0&output=svembed";
const satEmbed = l => "https://maps.google.com/maps?q=" + l.lat + "," + l.lng + "&t=k&z=19&output=embed";
function satBg(l) {
  const z = 18, n = 2 ** z, r = l.lat * Math.PI / 180;
  const fx = (l.lng + 180) / 360 * n, fy = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n;
  const x = Math.floor(fx), y = Math.floor(fy);
  const S = 512, px = (fx - x) * S, py = (fy - y) * S;
  return "background-image:url(https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/" + z + "/" + y + "/" + x + ");background-size:" + S + "px " + S + "px;background-position:" + (38 - px).toFixed(0) + "px " + (38 - py).toFixed(0) + "px";
}
const waUrl = t => { const d = t.replace(/\D/g, ""); return (d.length === 11 && d[2] === "9") ? "https://wa.me/55" + d : null; };

// mapa
let map = null, markers = [];
if (window.L) {
  map = L.map("map", {zoomControl: true}).setView([-21.785, -48.17], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  L.marker(IF, {icon: L.divIcon({className: "", html: '<div class="if">🎓 IFSP</div>', iconSize: [60, 24], iconAnchor: [30, 12]})}).addTo(map);
  L_.forEach((l, i) => {
    const m = L.marker([l.lat, l.lng], {icon: pinIcon(i)}).addTo(map);
    m.bindPopup(() => '<b>' + (i + 1) + '. ' + esc(l.n) + '</b><br>' + esc(l.b) + ' · ' + kmTxt(l.km) + ' km');
    m.on("click", () => selecionar(i, false));
    markers.push(m);
  });
  map.fitBounds(L.latLngBounds(L_.map(l => [l.lat, l.lng]).concat([IF])), {padding: [30, 30]});
} else {
  document.getElementById("map").innerHTML = '<div style="padding:20px;color:#6b7280">O mapa não carregou neste visualizador. A lista funciona normalmente.</div>';
}

function pinIcon(i) {
  return L.divIcon({className: "", html: '<div class="pin' + (ativo === i ? ' sel' : '') + '" style="background:' + COR[estado(i)] + '"><span>' + (i + 1) + '</span></div>', iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28]});
}
function atualizaPin(i) { if (markers[i]) markers[i].setIcon(pinIcon(i)); }

function render() {
  const q = document.getElementById("busca").value.toLowerCase();
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  L_.forEach((l, i) => {
    const e = estado(i);
    if (filtro !== "todos" && e !== filtro) return;
    if (q && !(l.n + " " + l.b).toLowerCase().includes(q)) return;
    const wa = l.tel ? waUrl(l.tel) : null;
    const d = document.createElement("div");
    d.className = "item" + (e === "feito" ? " feito" : "") + (e === "nao" ? " nao" : "") + (ativo === i ? " ativo" : "");
    d.id = "it" + i;
    d.innerHTML =
      '<button class="thumb" data-sv="' + i + '" style="' + satBg(l) + '" title="Ver fachada">' +
        (l.foto ? '<img src="' + l.foto + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : '') +
        '<span class="n">' + (i + 1) + '</span><span class="lbl">📷 Ver</span></button>' +
      '<div class="corpo">' +
        '<div class="nome">' + esc(l.n) + '</div>' +
        '<div class="meta">' + esc(l.e) + ' · ' + esc(l.b) + '</div>' +
        '<div class="meta">' + kmTxt(l.km) + ' km do IF' + (l.r ? ' · ★ ' + kmTxt(l.r) + ' (' + l.nr + ')' : '') + (l.h ? ' · ' + esc(l.h) : '') + '</div>' +
        '<span class="tipo">' + esc(l.t) + '</span>' +
        '<div class="linha">' +
          '<label class="chk"><input type="checkbox" data-feito="' + i + '"' + (e === "feito" ? " checked" : "") + '> Visitado</label>' +
          '<button class="vou' + (e === "vou" ? " on" : "") + '" data-vou="' + i + '">' + (e === "vou" ? "★ Vou" : "☆ Vou") + '</button>' +
          '<button class="naovou' + (e === "nao" ? " on" : "") + '" data-nao="' + i + '">' + (e === "nao" ? "✕ Não vou" : "Não vou") + '</button>' +
          '<a href="https://waze.com/ul?ll=' + l.lat + ',' + l.lng + '&navigate=yes" target="_blank" rel="noopener">Waze</a>' +
          (wa ? '<a href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' : (l.tel ? '<a href="tel:' + l.tel.replace(/\D/g, "") + '">' + esc(l.tel) + '</a>' : '')) +
        '</div>' +
      '</div>';
    lista.appendChild(d);
  });
  progresso();
}

function progresso() {
  const tot = L_.length;
  const f = L_.filter((_, i) => estado(i) === "feito").length;
  const v = L_.filter((_, i) => estado(i) === "vou").length;
  const nv = L_.filter((_, i) => estado(i) === "nao").length;
  document.getElementById("progbar").style.width = (f / tot * 100) + "%";
  document.getElementById("progtxt").textContent = f + " de " + tot + " visitados · " + v + " vou · " + nv + " não vou";
  const b = document.getElementById("rota");
  b.disabled = v === 0 || v > MAXROTA;
  b.textContent = v === 0 ? 'Marque "Vou" para montar a rota'
    : v > MAXROTA ? v + ' marcados (a rota aceita até ' + MAXROTA + ')'
    : 'Abrir rota no Google Maps (' + v + ' parada' + (v > 1 ? 's' : '') + ')';
}

function setEstado(i, e) {
  if (e === "pend") delete st[i]; else st[i] = e;
  salvar(); atualizaPin(i); render();
}

function selecionar(i, voar) {
  const ant = ativo; ativo = i;
  if (ant !== null) atualizaPin(ant);
  atualizaPin(i);
  if (map && voar) {
    if (window.innerWidth <= 800) window.scrollTo({top: 0, behavior: "smooth"});
    map.flyTo([L_[i].lat, L_[i].lng], 16, {duration: .6}); markers[i].openPopup();
  }
  document.querySelectorAll(".item.ativo").forEach(x => x.classList.remove("ativo"));
  const el = document.getElementById("it" + i);
  if (el) { el.classList.add("ativo"); if (!voar) el.scrollIntoView({behavior: "smooth", block: "center"}); }
}

let svAtual = null;
function mostrarAba(a) {
  document.querySelectorAll(".aba").forEach(b => b.classList.toggle("on", b.dataset.aba === a));
  const l = L_[svAtual];
  const fr = document.getElementById("mframe"), im = document.getElementById("mimg");
  if (a === "foto") { im.src = l.foto; im.style.display = "block"; fr.style.display = "none"; fr.src = "about:blank"; }
  else { im.style.display = "none"; fr.style.display = "block"; fr.src = a === "sv" ? svEmbed2(l) : satEmbed(l); }
  document.getElementById("mdica").style.visibility = a === "sv" ? "visible" : "hidden";
}
function abrirSV(i) {
  svAtual = i;
  const l = L_[i];
  document.getElementById("mtit").textContent = (i + 1) + ". " + l.n;
  document.getElementById("abaFoto").style.display = l.foto ? "" : "none";
  mostrarAba(l.foto ? "foto" : "sv");
  document.getElementById("mlink").href = svUrl(l);
  document.getElementById("modal").classList.add("on");
}
function fecharSV() { document.getElementById("modal").classList.remove("on"); document.getElementById("mframe").src = "about:blank"; }

document.getElementById("lista").addEventListener("click", ev => {
  const t = ev.target;
  const sv = t.closest("[data-sv]");
  if (sv) { abrirSV(+sv.dataset.sv); return; }
  if (t.dataset.vou !== undefined) { const i = +t.dataset.vou; setEstado(i, estado(i) === "vou" ? "pend" : "vou"); return; }
  if (t.dataset.nao !== undefined) { const i = +t.dataset.nao; setEstado(i, estado(i) === "nao" ? "pend" : "nao"); return; }
  if (t.closest("a,label,input")) return;
  const it = t.closest(".item");
  if (it) selecionar(+it.id.slice(2), true);
});
document.getElementById("lista").addEventListener("change", ev => {
  const i = ev.target.dataset.feito;
  if (i !== undefined) setEstado(+i, ev.target.checked ? "feito" : "pend");
});
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
  c.classList.add("on"); filtro = c.dataset.f; render();
}));
document.getElementById("busca").addEventListener("input", render);
document.getElementById("mfechar").addEventListener("click", fecharSV);
document.querySelectorAll(".aba").forEach(b => b.addEventListener("click", () => mostrarAba(b.dataset.aba)));
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") fecharSV(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharSV(); });

document.getElementById("rota").addEventListener("click", () => {
  const pts = L_.map((l, i) => ({l, i})).filter(x => estado(x.i) === "vou").sort((a, b) => a.l.km - b.l.km).map(x => x.l.lat + "," + x.l.lng);
  if (!pts.length || pts.length > MAXROTA) return;
  let url = "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=" + IF.join(",") + "&destination=" + pts[pts.length - 1];
  if (pts.length > 1) url += "&waypoints=" + encodeURIComponent(pts.slice(0, -1).join("|"));
  window.open(url, "_blank");
